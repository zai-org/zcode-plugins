# 意象 → 视觉元素 词典
# 用途：把诗词/灵感中的意象，翻译成画面里可执行的具体元素。
# 处理某意象时优先查这里；查不到则按常识归纳，并顺手把新映射补进来。
# 注意：具体「怎么画」由当前风格的部件级规则决定（见各风格 prompt.positive.txt），
#       本词典只回答「画什么」。

自然:
  莺 / 鸟 / 飞禽: 小飞鸟剪影，点缀枝头或空中
  柳: 垂枝，概括为疏密块面
  桃 / 杏 / 花: 疏落红点或小色块
  荷 / 莲: 圆叶色块 + 一两朵花块
  竹: 竖向细杆 + 块状叶
  山 / 远山: 远处淡色平涂块，层层退远
  烟雨 / 雾: 横向淡色带 + 少量细点，朦胧，压低对比
  水 / 江 / 湖 / 河: 横向几笔短线 + 大量留白
  月: 圆形留白或淡色圆
  日 / 夕阳: 淡色圆 + 横向暖色带
  云: 平涂淡色块
  雪: 大量纸色留白 + 少量细点
  风: 用倾斜的酒旗、斜向雨丝或飘动的枝叶暗示，不直接画

建筑:
  寺 / 寺庙: 成组深色坡屋顶剪影
  楼台 / 亭 / 塔: 深色轮廓 + 纸色留白墙面
  村 / 郭 / 城: 数座坡顶屋块，可临水
  酒旗 / 幡: 一根细杆 + 小旗块，倾斜示风
  桥: 弧线 + 短刻痕
  台阶: 纸色留白 + 少量横线
  城墙: 横向平涂块 + 顶部深色轮廓

人物:
  孤舟 / 舟 / 船: 小舟形，纸色留白，人简化为小色块
  行人: 简化为一两个竖向小色块
  渔翁 / 钓者: 小色块 + 细线（竿）
  骑者 / 马: 两个相连色块，简化轮廓

色彩:
  绿映红: 低饱和绿块 + 疏落红点缀
  青: 低饱和蓝绿块
  苍 / 苍茫: 灰蓝调，降低对比
  金 / 暖: 暖黄橙块，克制使用

情绪基调（影响整体处理，不直接成元素）:
  清雅 / 静谧: 留白多、低饱和、元素疏
  苍凉 / 孤寂: 冷调、大留白、元素极少
  热烈: 红黄比例提高、元素变密
  悠远: 远山层叠、大量留白
