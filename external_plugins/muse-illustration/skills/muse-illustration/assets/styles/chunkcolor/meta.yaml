name: 色块彩墨
id: chunkcolor
summary: 下三分之二沉静单色面 + 上沿细墨线白描 + 大留白，展览海报式现代彩墨
best_for: [古典诗词, 山水, 江南, 水乡, 田园]
mood: [清雅, 静谧, 克制, 隐逸]
default:
  size: 1024x1536
  quality: high
  variants: 1
anchor_required: true
# 随包附带的 ref.jpg 是**本项目自己生成并被采纳的成图**（＝ assets/cases/images/2026-10-14-jiangnanchun-chunkcolor.jpg），
# 作为本风格的标杆样例；原始第三方展览海报的版权不属于本项目，未随包发布。
# 按 image1 传入（input_fidelity=medium）做风格锚定；如你另有同风格参考图，也可替换。
anchor_dir:
anchor_file:
positive_file: prompt.positive.txt
negative_file: prompt.negative.txt
ref: ref.jpg
notes: >
  提取自 ref/chunkcolor/ 下 9 张展览海报变体。内核：一整块单色面 + 上沿细墨线 + 大留白。
  三个易错点（v1→v3 勘误两次，务必照做）：
  1）色块必须「赋形」——它就是主体本身（江／田／山／竹林），有针对性地画出「这个东西」，
     不是抽象泼洒；参考图里寒江＝江水、麦野＝麦田、松间＝山体（且看得出崎岖）。
  2）色块形体必须端正安定——「下三分之二的沉静色面、上沿大致齐平」或「一道端正竖色柱」；
     弯曲的 S 形装饰曲线已被否掉。「有机」只体现在边缘的洇散／撕纸边质感上，不是形状。
  3）必须在提示词里点名那块色写的是什么（{MASS_IS}），不点名模型必然退回随机泼洒。
  参考图锚定：本风格**随包附带 ref.jpg**，即本项目自己生成并采纳的成图；原始第三方参考图未随包发布。
  同一套文字跑 A/B 对照，**传参考图版明显更接近目标感觉**——因此本风格把参考图锚定当作默认动作，而非加分项
  （组装时另需声明「只借风格、不抄构图」）。留红开关：默认严守单色（负向补 no red accent）；题材有色差点题时（如「绿映红」）可破例
  一点朱红 #B5443A 作诗眼，面积 <1%、1-2 处、位置即诗眼本身，性质是「一点」非第二个色块。
