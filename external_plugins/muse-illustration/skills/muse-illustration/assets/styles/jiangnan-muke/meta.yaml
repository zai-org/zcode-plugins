  首条入库风格，源自杜牧《江南春》的一次生成。参考图为竖版立轴构图。
  复现要点：部件级指令（屋顶=深色轮廓 / 墙=纸色留白 / 水=几笔横线）+ 显式负向约束。
  已跨题材验证：杜牧《江南春》、白居易《忆江南》两首均获用户采纳（2026-10-14），
  证明配方具备跨题材可移植性；参考图以 image1 传入 + 声明「只借风格不抄构图」可有效防止构图照抄。
