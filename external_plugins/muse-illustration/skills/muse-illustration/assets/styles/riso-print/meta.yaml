notes: >
  源自杜牧《江南春》的 risograph 版生成（2026-10-14）。与 jiangnan-muke（水印木刻）并列，
  但更强调丝网/孔版印刷的工业手工感。配方由用户从参考图提取并固化为一份本地风格笔记
  （作者本地文件，未随包发布），此处入库存为可复用风格。
  调色板为「3-4 色 + 米白纸留白」结构，可整体替换（如橘红+藏蓝+米白）而维持风格。
  复现要点：① 平涂色块+粗犷笔触、无渐变无描边轮廓；② 中间调靠两色叠印产生纹理；
  ③ 高光/云/雾用米白留白；④ 远景几何化平色山形；⑤ 近景短促密集方向性笔触（草丛/水波）。
  诗眼色彩（如「绿映红」之红、酒旗之红）可保留少量红点，也可按用户要求严格只用调色板色。
