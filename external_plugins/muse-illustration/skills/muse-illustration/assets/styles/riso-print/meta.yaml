name: 江南春·risograph 版画
id: riso-print
summary: 米白纸底、3-4 色有限调色板、平涂色块+粗犷笔触，risograph/丝网印刷手工套色质感（颗粒噪点、油墨不均、套色错位、色块边缘粗糙肌理）
best_for: [古典诗词, 山水, 江南, 田园, 建筑群]
