<main><div class="eyebrow">让 AI 连接你正在使用的浏览器</div><h1 id="page-title">为客户端连接 Chrome</h1><p id="page-subtitle">首次设置一次，以后直接在 ZCode 等客户端聊天中调用浏览器。</p><div class="steps"><span id="s1"><b>1</b>打开安装页面</span><span id="s2"><b>2</b>加载 Chrome 扩展</span><span id="s3"><b>3</b>验证与试用</span></div><section id="view"></section><div class="footer"><span>适用于 ZCode 等支持此插件的客户端</span><span>正式引导 · 真实检测本机连接状态</span></div></main><div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";
const TOKEN=new URLSearchParams(location.search).get("t");
const view=document.querySelector("#view");
let info=null,toastTimer;

const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notice(m){const el=document.querySelector("#toast");el.textContent=m;el.classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("hidden"),3200)}

async function pageApi(path,opts={}){
  const sep=path.includes("?")?"&":"?";
  let res;
  try{
    res=await fetch(path+sep+"t="+encodeURIComponent(TOKEN),{method:opts.method||"GET",headers:opts.body?{"Content-Type":"application/json"}:{},body:opts.body,signal:AbortSignal.timeout(15000)});
  }catch(e){throw new Error("network")}
  if(res.status===403)throw new Error("expired");
  if(!res.ok)throw new Error("http"+res.status);
  return res.json();
}

/* ---------- 演示动画（示意，与真实状态无关；支持暂停与 reduced-motion） ---------- */
let demoPhase=0,motionPaused=matchMedia("(prefers-reduced-motion: reduce)").matches,demoTimer;
function motionButton(){return `<button data-action="motion">${motionPaused?"播放演示":"暂停演示"}</button>`}
const isMac=()=>!!(info&&info.platform==="darwin");
const manualChrome=()=>!!(info&&info.platform==="win32");
function chromeAddress(){return `<div class="directory"><strong>在 Chrome 地址栏粘贴以下地址并回车</strong><code id="chrome-address" class="pathcode">chrome://extensions/</code><button class="secondary" data-action="copy-chrome">复制管理页地址</button></div>`}
async function copyChrome(){
  const text="chrome://extensions/";
  try {
    if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error("unavailable");
    await navigator.clipboard.writeText(text);return true;
  } catch(e) {
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();return ok;
  }
}
function mock(){const mac=isMac();return `<div class="visual install-demo" data-phase="0"><div class="visual-top"><span>安装操作演示 · 不代表安装进度</span>${motionButton()}</div><div class="install-route"><b>开开发者模式</b>→<b>点加载</b>→<b>${mac?"⌘⇧G 粘贴路径":"Ctrl+L 粘贴路径"}</b>→<b>${mac?"选择":"选择文件夹"}</b></div><div class="mock" aria-label="Chrome 扩展安装动态示意"><div class="chrome-bar"><span class="dots">● ● ●</span>Chrome / 扩展程序</div><div class="browser-head"><strong>扩展程序</strong><div class="dev highlight">开发者模式 <i class="toggle"></i></div></div><span class="load highlight">加载已解压的扩展程序</span><div class="fdialog"><div class="fdialog-title">文件选择窗口${mac?"（⌘⇧G 前往文件夹）":"（Ctrl+L 定位路径）"}</div><div class="fdialog-hint">${mac?`按 <kbd>⌘</kbd><kbd>⇧</kbd><kbd>G</kbd> 后粘贴路径，回车`:`按 <kbd>Ctrl</kbd><kbd>L</kbd> 或点击地址栏 → 粘贴已复制路径 → 回车`}</div><code class="pathline">${esc(info&&info.ext_dir||"…/extension")}</code><div class="fdialog-actions"><span class="confirm">${mac?"选择":"选择文件夹"}</span><span class="cancel">取消</span></div></div><div class="annotation">${mac?"⌘⇧G 在弹出的文件选择窗口内使用（不是 Finder）":"Ctrl+L 在弹出的文件选择窗口内使用（不是资源管理器）"}；路径由引导复制，无需手输</div></div><div class="phase-nav"><button data-phase-select="0">① 开开发者模式</button><button data-phase-select="1">② 点加载</button><button data-phase-select="2">③ ${mac?"⌘⇧G 粘贴路径":"Ctrl+L 粘贴路径"}</button><button data-phase-select="3">④ ${mac?"确认「选择」":"「选择文件夹」"}</button></div><div class="phase-caption" data-caption></div></div>`}
function launchDemo(){return `<div class="focus-demo" data-phase="0"><div class="demo-toolbar"><span>点击后会发生什么 · 动画示意</span>${motionButton()}</div><div class="launch-items"><div class="launch-item"><span class="launch-symbol">▣</span><strong>Chrome 扩展管理页</strong><small>自动打开</small></div><div class="launch-item"><span class="launch-symbol">▰</span><strong>extension 文件夹</strong><small>自动定位</small></div></div><div class="launch-note">一次点击，准备好安装所需的两个窗口。</div></div>`}
function trialDemo(){return `<div class="chat-demo" data-phase="0"><div class="chat-top"><span>ZCode 等客户端 · 试用示意</span>${motionButton()}</div><div class="chat-body"><div class="bubble">列出我当前 Chrome 中的标签页</div><div class="reply"><span class="reply-icon">✦</span><span data-chat-result>发送指令后，AI 会调用浏览器工具。</span></div></div></div>`}
function paintDemo(){document.querySelectorAll("[data-phase-select]").forEach(b=>b.classList.toggle("selected",Number(b.dataset.phaseSelect)===demoPhase));const install=document.querySelector(".install-demo");if(install)install.dataset.phase=demoPhase;const launch=document.querySelector(".focus-demo");if(launch)launch.dataset.phase=demoPhase;const chat=document.querySelector(".chat-demo");if(chat){chat.dataset.phase=demoPhase;const r=document.querySelector("[data-chat-result]");if(r)r.textContent=["发送指令后，AI 会调用浏览器工具。","正在调用 browser_tabs，读取 Chrome 标签页……","示例结果：找到 2 个标签页：项目文档、示例网站。"][demoPhase]||""}const cap=document.querySelector("[data-caption]");if(cap)cap.textContent=demoCaptions()[demoPhase]||"";document.querySelectorAll('[data-action="motion"]').forEach(b=>b.textContent=motionPaused?"播放演示":"暂停演示");view.classList.toggle("motion-paused",motionPaused)}
function demoCaptions(){return isMac()?["在 chrome://extensions 右上角开启开发者模式。","点击左上角「加载已解压的扩展程序」。","弹出的是文件选择窗口（不是 Finder）：按 ⌘⇧G 打开「前往文件夹」，粘贴第②步复制的路径，回车。","点「选择」确认加载；回到本页等待连接（扩展角标变 ● 自动继续）。"]:["在 chrome://extensions 右上角开启开发者模式。","点击左上角「加载已解压的扩展程序」。","弹出的是文件选择窗口：按 Ctrl+L（或点击顶部地址栏），粘贴第②步复制的路径，回车。","点「选择文件夹」确认加载；回到本页等待连接（扩展角标变 ● 自动继续）。"]}
function startDemo(){clearInterval(demoTimer);demoPhase=0;paintDemo();if(!document.querySelector(".install-demo,.focus-demo,.chat-demo"))return;demoTimer=setInterval(()=>{if(motionPaused||document.hidden)return;const mod=document.querySelector(".focus-demo")?2:(document.querySelector(".chat-demo")?3:4);demoPhase=(demoPhase+1)%mod;paintDemo()},2600)}

/* ---------- 视图渲染 ---------- */
function directoryBox(open){
  const p=esc(info&&info.ext_dir||"");
  return `<details class="tech dir-details" id="dir-details"${open?" open":""}><summary>扩展完整路径（复制 / 排障用）</summary><code id="extpath" class="pathcode">${p}</code><small>路径来自本机实际安装位置；选择窗口里粘贴的就是它</small><div><button class="secondary" data-action="copy-path">复制路径</button><button class="secondary" data-action="folder">显示扩展文件夹 ↗</button></div></details>`
}
function chainStop(title,small,cls){return `<div class="verify-stop ${cls||""}"><strong>${title}</strong><small>${small}</small></div>`}
function renderChecking(t,bridge){
  const b=bridge||{};
  let summary;
  if(t.state==="fail")summary=`<div class="verify-summary"><strong>浏览器访问检查未通过</strong><p style="color:#8a6a33">${esc(t.error||"未知错误")}</p><button class="primary" style="margin-top:14px" data-action="retry-check">重新检测</button></div>`;
  else summary=`<div class="verify-summary"><strong><i class="scan"></i>正在尝试只读读取浏览器标签页</strong><p>浏览器访问通过后，再回到客户端完成首次调用。</p></div>`;
  view.innerHTML=`<div class="success"><h2>正在检查浏览器是否可调用</h2><p>这一步自动完成，无需在 Chrome 中继续操作。</p><div class="verify-chain">${chainStop("客户端 MCP","待回客户端实际验证","pending")}<span>→</span>${chainStop("本地桥接服务",b.up?"✓ 运行中":"✗ 未运行",b.up?"active":"")}<span>→</span>${chainStop("Chrome 扩展",b.extension_connected?"✓ 已连接":"○ 未连接",b.extension_connected?"active":"")}</div>${summary}<p class="micro">真实检测：执行只读标签页检查，页面仅显示数量，不展示标题和网址。</p></div>`;
}
function render(state,payload){
  const p=payload||{};
  if(state==="checking"){renderChecking(p.tabs||{state:"pending"},p.bridge);return}
  if(state==="loading")view.innerHTML=`<div class="success"><h2>正在检查当前连接状态…</h2><p>确认桥接服务与 Chrome 扩展的状态，稍等。</p></div>`;
  else if(state==="start"&&manualChrome()&&info.ext_dir_exists)view.innerHTML=`<div class="content"><div><h2>先准备 Chrome 扩展管理页</h2><p>${info.chrome_found===false?"未找到 Google Chrome，请先确认已安装并打开 Chrome。<br>":""}点击下方按钮复制地址并打开扩展文件夹，再到 Chrome 地址栏粘贴、回车。</p>${chromeAddress()}<button class="primary" data-action="open">复制管理页地址并打开文件夹</button><p class="micro">管理页需要在 Chrome 中手动进入。</p><div id="start-err" class="errbox hidden"></div><button class="secondary" data-action="check-now">之前装过？直接检查连接 →</button></div>${mock()}</div>`;
  else if(state==="start"&&info&&info.open_supported)view.innerHTML=`<div class="content"><div><h2>先打开安装所需的窗口</h2><p>我们会打开 Chrome 管理页，<br>同时定位需要加载的扩展文件夹。</p><button class="primary" data-action="open">打开 Chrome 安装页面 ↗</button><p class="micro">无需输入网址，也不用自己查找目录。</p><div id="start-err" class="errbox hidden"></div><button class="secondary" style="margin-top:14px" data-action="check-now">之前装过？直接检查连接 →</button></div>${launchDemo()}</div>`;
  else if(state==="start"){
    const winNoChrome=info&&info.platform==="win32"&&info.chrome_found===false;
    const knownDesktop=isMac()||(info&&info.platform==="win32");
    const manualHint=winNoChrome
      ?"未找到 Google Chrome：自动打开需要 Chrome 安装在标准位置。<br>请手动打开 <b>chrome://extensions</b>，并加载下面的文件夹："
      :(knownDesktop
        ?"自动打开暂不可用（未找到扩展目录）。<br>请手动打开 <b>chrome://extensions</b>，并加载下面的文件夹："
        :"自动打开目前支持 macOS 与 Windows。<br>请手动打开 <b>chrome://extensions</b>，并加载下面的文件夹：");
    view.innerHTML=`<div class="content"><div><h2>手动准备两个窗口</h2><p style="font-size:14px">${manualHint}</p>${directoryBox(true)}<div style="margin-top:14px"><button class="secondary" data-action="copy-chrome">复制 chrome://extensions 地址</button><button class="primary" style="margin-top:0" data-action="manual-next">我已打开，开始等待连接 →</button></div><button class="secondary" style="margin-top:14px" data-action="check-now">之前装过？直接检查连接 →</button></div>${mock()}</div>`;
  }
  else if(state==="install")view.innerHTML=`<div class="content"><div><h2>跟着演示完成加载</h2>${manualChrome()?chromeAddress():""}<ol class="stepslist"><li>在 Chrome 扩展管理页右上角开启<b>开发者模式</b></li><li><button class="primary" style="margin:2px 8px 2px 0;padding:7px 14px" data-action="copy-path">复制扩展路径 ⧉</button>复制后切回 Chrome</li><li>点 Chrome 左上角<b>加载已解压的扩展程序</b></li><li>${isMac()?`在弹出的文件选择窗口按 <kbd>⌘</kbd><kbd>⇧</kbd><kbd>G</kbd>，粘贴路径，回车，点<b>「选择」</b>确认`:`在弹出的文件选择窗口按 <kbd>Ctrl</kbd><kbd>L</kbd> 或点击地址栏，粘贴已复制的路径，回车后点<b>「选择文件夹」</b>`}</li></ol><p class="micro">${isMac()?"文件选择窗口 ≠ Finder：⌘⇧G 是窗口内的「前往文件夹」，无需逐层找目录；路径由系统提供，不用手动输入。":"文件选择窗口 ≠ 资源管理器：按 Ctrl+L（或点击地址栏）粘贴已复制的路径即可，无需逐层找目录；复制只把路径放进剪贴板，导航需在窗口内完成。"}</p>${directoryBox(false)}${info&&info.open_supported&&!manualChrome()?`<button class="secondary" data-action="reopen">重新打开 Chrome 管理页 ↗</button>`:`<button class="secondary" data-action="copy-chrome">复制 chrome://extensions 地址</button>`}</div>${mock()}</div><div class="status"><i class="pulse"></i><span id="waitline">等待 Chrome 扩展连接…（扩展图标角标变 ● 后自动继续）</span></div>`;
  else if(state==="success")view.innerHTML=`<div class="success"><div class="check">✓</div><h2>最后一步，回到客户端试一次</h2><p>${p.reentry?"浏览器端已是连接状态，之前安装的扩展继续可用。":"浏览器端已就绪。让 ZCode 中的 AI 发起第一次浏览器调用。"}</p>${trialDemo()}<div class="capabilities"><span>读取网页</span><span>点击与填写</span><span>网页截图</span></div><button class="primary" style="margin-top:5px" data-action="copy-prompt">复制这句指令，去客户端试用</button><p class="micro">新开或重启客户端会话，再粘贴发送。<br>收到真实标签页列表，才表示客户端调用已成功。</p><p class="micro">「客户端 MCP」一栏在你真实试用成功前保持「待验证」，引导不会替你宣告成功。</p><button class="secondary" data-action="done">完成引导</button></div>`;
  else if(state==="offline")view.innerHTML=`<div class="success"><div class="check" style="background:#f4eee1;color:#9a7840">↔</div><h2>与 Chrome 的连接断开了</h2><p>请确认 Chrome 已打开，且扩展处于启用状态。<br>恢复后会自动重新验证，无需重复安装。</p><button class="primary" data-action="retry-check">重新检测</button><br>${info&&info.open_supported&&!manualChrome()?`<button class="secondary" data-action="reopen">打开扩展管理页面 ↗</button>`:""}</div>`;
  else if(state==="paused")view.innerHTML=`<div class="success"><div class="check">Ⅱ</div><h2>已连接，控制已暂停</h2><p>在 Chrome 中打开 Browser Bridge 扩展面板，<br>关闭「暂停」开关后，即可继续使用。</p><button class="primary" data-action="retry-check">重新检测</button><p class="micro">引导不会自动解除你的暂停设置。</p></div>`;
  else if(state==="svcdown"){
    const home=info&&info.bridge_home?info.bridge_home:"~/.browser-bridge";
    const port=info&&info.bridge_port?info.bridge_port:8765;
    view.innerHTML=`<div class="success"><div class="check" style="background:#f4eee1;color:#9a7840">⚠</div><h2>本地桥接服务未运行</h2><p>桥接服务负责转发工具调用，引导会尝试自动启动。<br>仍失败时请检查端口 ${port} 是否被其他程序占用。</p><button class="primary" data-action="ensure">再次尝试启动桥接服务</button><details class="tech"><summary>排障详情</summary><div>日志：<code>${esc(home)}/logs/bridge-${port}.log</code><br>Browser Bridge 需要可用的 Node.js。若客户端支持托管运行时，可在其配置中启用；否则需本机安装 Node.js。引导不会下载或安装任何运行时。</div></details></div>`;
  }
  else if(state==="offlineNet")view.innerHTML=`<div class="success"><div class="check" style="background:#f4eee1;color:#9a7840">◍</div><h2>与引导服务的连接中断</h2><p>引导服务可能已退出（空闲 30 分钟自动关闭）或正在重启。<br>正在自动重试连接；也可以重跑 <b>/cc-browser-setup</b>${isMac()?" 或双击 <b>setup.command</b> 打开新页面":"，请手动运行上述命令重开"}。</p><button class="primary" data-action="retry-poll">立即重试</button></div>`;
  else if(state==="expired")view.innerHTML=`<div class="success"><div class="check" style="background:#f4eee1;color:#9a7840">!</div><h2>引导会话不可用</h2><p>页面令牌缺失或已过期（引导服务可能已重启）。<br>请重新运行 <b>/cc-browser-setup</b>${isMac()?"，或在 Finder 双击 <b>setup.command</b>，使用新打开的页面":"，请手动运行上述命令，使用新打开的页面"}。</p></div>`;
  else if(state==="done")view.innerHTML=`<div class="success"><div class="check">✓</div><h2>引导完成</h2><p>可以关闭此页面。回到客户端发送「列出我当前 Chrome 中的标签页」，<br>收到真实结果即完成最终验证。</p></div>`;
}

/* ---------- 状态机（onboard-state.js）接线 ---------- */
const m=OnboardState.createStateMachine({
  setTitles(t){document.querySelector("#page-title").textContent=t.title;document.querySelector("#page-subtitle").textContent=t.subtitle;for(let n=1;n<=3;n++)document.querySelector("#s"+n).classList.toggle("current",n===t.step)},
  render(next,payload){render(next,payload);startDemo()},
  installWaitSlow(){const el=document.querySelector("#waitline");if(el)el.textContent="等待较久：请确认已开启开发者模式，并选择了正确的 extension 文件夹；加载成功后会自动继续，本页会一直检测。"},
  notice,
  showPrepareError(msg){const box=document.querySelector("#start-err");if(!box)return;box.classList.remove("hidden");box.innerHTML=`<b>打开失败：</b><span>${esc(msg)}</span><button class="secondary" data-action="retry-open">重试</button>`},
  ensureBridge(){pageApi("/api/action",{method:"POST",body:JSON.stringify({action:"ensure_bridge"})}).catch(()=>{})},
  setInfo(i){info=i},
  isHidden(){return document.hidden},
  request:pageApi,
});

async function doAction(btn,action,okMsg){
  btn.disabled=true;
  try{const r=await pageApi("/api/action",{method:"POST",body:JSON.stringify({action})});r&&r.ok?notice(okMsg):notice("操作失败："+((r&&r.reason)||"未知原因"))}catch(e){notice("操作失败，请重试或手动打开管理页 / 文件夹")}
  btn.disabled=false;
}
function copy(text,okMsg,failMsg){
  const done=()=>notice(okMsg),fail=()=>{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}
    ta.remove();notice(ok?okMsg:failMsg);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fail);
  else fail();
}
/* 复制扩展路径：任何一步失败都自动展开路径区并选中真实文本供手动复制，绝不虚报成功 */
function copyPath(){
  const text=info&&info.ext_dir||"";
  const done=()=>notice(isMac()
    ?"路径已复制（仅表示已进剪贴板）：回到 Chrome 的选择窗口，先 ⌘⇧G 前往文件夹，再 ⌘V 粘贴、回车"
    :"路径已复制（仅表示已进剪贴板）：回到 Chrome 的选择窗口，按 Ctrl+L 或点击地址栏，粘贴路径，回车后选择文件夹");
  const manual=()=>{
    const d=document.querySelector("#dir-details");if(d)d.open=true;
    const el=document.querySelector("#extpath");
    if(el&&window.getSelection){const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}
    notice("自动复制失败：已展开并选中路径文本，请手动复制（⌘C / Ctrl+C）");
  };
  const fallback=()=>{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}
    ta.remove();ok?done():manual();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fallback);
  else fallback();
}
async function ensureFromPage(){
  try{await pageApi("/api/action",{method:"POST",body:JSON.stringify({action:"ensure_bridge"})})}catch(e){}
  setTimeout(()=>m.poll(true),1500);
}
document.addEventListener("click",async(e)=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.phaseSelect!==undefined){demoPhase=Number(b.dataset.phaseSelect);motionPaused=true;paintDemo();return}
  switch(b.dataset.action){
    case"motion":motionPaused=!motionPaused;paintDemo();break;
    case"open":case"retry-open":{
      const orig=b.textContent;b.disabled=true;b.textContent="正在准备…";
      const copied=manualChrome()?await copyChrome():false;
      const ok=await m.prepare();
      b.disabled=false;b.textContent=orig;
      if(ok)notice(manualChrome()?(copied?"地址已复制、文件夹已打开；请到 Chrome 地址栏粘贴并回车":"文件夹已打开；复制失败，请手动复制上方管理页地址"):"已打开 Chrome 管理页并定位扩展文件夹");
      break;
    }
    case"reopen":await doAction(b,"open_extensions","已打开 Chrome 扩展管理页");break;
    case"folder":await doAction(b,"reveal_folder",isMac()?"已在 Finder 定位扩展文件夹":"已在资源管理器打开扩展文件夹");break;
    case"copy-path":copyPath();break;
    case"copy-chrome":notice(await copyChrome()?"地址已复制；请在 Chrome 地址栏粘贴并回车":"复制失败，请手动复制 chrome://extensions/");break;
    case"copy-prompt":copy("列出我当前 Chrome 中的标签页","指令已复制，请回到 ZCode 等客户端发送","复制失败，请手动复制上方指令");break;
    case"check-now":case"retry-check":m.recheck();break;
    case"ensure":ensureFromPage();break;
    case"retry-poll":m.poll(true);break;
    case"manual-next":m.setState("install");break;
    case"done":{b.disabled=true;const ok=await m.performDone();if(!ok)b.disabled=false;break}
  }
});

(async()=>{
  await m.start();
  setInterval(()=>m.poll(false),2000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)m.poll(false)});
})();
</script>
</html>
