<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android Runner</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg-2: var(--color-background-secondary, #f6f7f9);
    --bg-3: var(--color-background-tertiary, #eceef2);
    --fg: var(--color-text-primary, #1c2128);
    --fg-2: var(--color-text-secondary, #5c6672);
    --fg-3: var(--color-text-tertiary, #8b95a1);
    --border: var(--color-border-primary, #d8dde4);
    --border-2: var(--color-border-secondary, #e6eaef);
    --ok: var(--color-text-success, #1a7f37);
    --ok-bg: var(--color-background-success, #e6f4ea);
    --warn: var(--color-text-warning, #9a6700);
    --warn-bg: var(--color-background-warning, #fff8e1);
    --bad: var(--color-text-danger, #b42318);
    --bad-bg: var(--color-background-danger, #fdecea);
    --accent: var(--color-text-info, #0969da);
    --accent-bg: var(--color-background-info, #e7f0fb);
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--color-background-primary, #16191d);
      --bg-2: var(--color-background-secondary, #1c2027);
      --bg-3: var(--color-background-tertiary, #242a32);
      --fg: var(--color-text-primary, #e6eaef);
      --fg-2: var(--color-text-secondary, #a7b1bd);
      --fg-3: var(--color-text-tertiary, #7d8794);
      --border: var(--color-border-primary, #2e353e);
      --border-2: var(--color-border-secondary, #262d35);
      --ok: var(--color-text-success, #4ac26b);
      --ok-bg: var(--color-background-success, #14291c);
      --warn: var(--color-text-warning, #d29922);
      --warn-bg: var(--color-background-warning, #2b2416);
      --bad: var(--color-text-danger, #f85149);
      --bad-bg: var(--color-background-danger, #2d1a1a);
      --accent: var(--color-text-info, #58a6ff);
      --accent-bg: var(--color-background-info, #12233a);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border-2);
    background: var(--bg); position: sticky; top: 0; z-index: 5;
    flex: 0 0 auto;
  }
  .logo {
    width: 24px; height: 24px; border-radius: 7px; flex: 0 0 auto;
    background: linear-gradient(135deg, #3ddc84, #1f9d5b);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #08130d;
  }
  .titles { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
  .title { font-weight: 650; font-size: 13.5px; letter-spacing: .01em; }
  .subtitle { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }

  main { flex: 1 1 auto; overflow: auto; padding: 12px 14px 20px; }
  section { margin-bottom: 16px; }
  h2 {
    font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
    color: var(--fg-3); margin: 0 0 8px; display: flex; align-items: center; gap: 8px;
  }
  h2 .spacer { flex: 1 1 auto; }

  button {
    font: inherit; font-size: 12.5px; cursor: pointer;
    background: var(--bg-2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 11px; transition: background .12s, border-color .12s, opacity .12s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--bg-3); border-color: var(--fg-3); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(135deg, #2fbe6f, #1f9d5b); color: #06170f;
    border-color: transparent; font-weight: 650;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); }
  button.ghost { background: transparent; border-color: transparent; color: var(--fg-2); padding: 3px 7px; }
  button.ghost:hover:not(:disabled) { background: var(--bg-2); color: var(--fg); }
  button.danger { color: var(--bad); border-color: var(--border); }
  button.danger:hover:not(:disabled) { background: var(--bad-bg); border-color: var(--bad); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--border-2);
    border-radius: var(--radius); padding: 9px 11px;
    display: flex; flex-direction: column; gap: 5px; min-width: 0;
  }
  .card.current { border-color: #2fbe6f; box-shadow: 0 0 0 1px #2fbe6f inset; }
  .card.fail { border-left: 3px solid var(--bad); }
  .card-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card-name { font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
    background: var(--bg-3); color: var(--fg-2); white-space: nowrap; flex: 0 0 auto;
  }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.accent { background: var(--accent-bg); color: var(--accent); }
  .card-actions { display: flex; gap: 6px; margin-top: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-2); border: 1px solid var(--border-2);
    border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; color: var(--fg-2);
  }
  .chip button { padding: 1px 8px; font-size: 11.5px; border-radius: 999px; }

  .kv { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--radius); padding: 2px 11px; }
  .kv-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-2); font-size: 12.5px; }
  .kv-row:last-child { border-bottom: 0; }
  .kv-k { flex: 0 0 96px; color: var(--fg-3); }
  .kv-v { flex: 1 1 auto; color: var(--fg-2); word-break: break-all; font-family: var(--mono); font-size: 11.5px; }
  .kv-v.ok { color: var(--ok); }
  .kv-v.bad { color: var(--bad); }

  .actions { display: flex; flex-wrap: wrap; gap: 7px; }
  .actions .grow { flex: 1 1 auto; }

  .tabs { display: flex; gap: 4px; align-items: center; border-bottom: 1px solid var(--border-2); padding-bottom: 0; }
  .tab {
    background: transparent; border: 0; border-radius: 0; padding: 6px 10px;
    color: var(--fg-3); font-size: 12px; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--fg); border-bottom-color: #2fbe6f; }
  .tab:hover:not(:disabled) { background: transparent; color: var(--fg); }
  .console-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .console-bar .state { font-size: 11.5px; color: var(--fg-3); flex: 1 1 auto; }
  pre#console {
    margin: 0; padding: 10px 12px; min-height: 130px; max-height: 42vh; overflow: auto;
    background: #0d1117; color: #d7dde5; border: 1px solid var(--border);
    border-radius: var(--radius); font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  pre#console.logcat { background: #0b0f14; }
  .empty { color: var(--fg-3); font-size: 12px; padding: 10px 0; }
  .banner {
    display: none; padding: 8px 12px; border-radius: var(--radius); font-size: 12.5px;
    background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); margin-bottom: 12px;
  }
  .banner.show { display: block; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--fg-3); border-top-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -1px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .loading { display: flex; align-items: center; justify-content: center; gap: 8px; height: 100%; color: var(--fg-3); font-size: 12.5px; }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--fg); padding: 0; max-width: 420px; box-shadow: 0 18px 48px rgba(0,0,0,.28); }
  dialog::backdrop { background: rgba(0,0,0,.42); }
  .dlg { padding: 16px 18px; }
  .dlg h3 { margin: 0 0 8px; font-size: 14px; }
  .dlg p { margin: 0 0 14px; color: var(--fg-2); font-size: 12.5px; line-height: 1.6; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
  select {
    font: inherit; font-size: 12px; background: var(--bg-2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; max-width: 100%;
  }
</style>
</head>
<body>
<header>
  <div class="logo">🤖</div>
  <div class="titles">
    <div class="title">Android Runner</div>
    <div class="subtitle" id="projectLabel">正在连接…</div>
  </div>
  <div class="header-actions">
    <select id="projectSelect" title="切换 Gradle 工程" style="display:none"></select>
    <button class="ghost" id="refreshBtn" title="刷新状态">⟳</button>
  </div>
</header>

<main id="main">
  <div class="loading" id="boot"><span class="spin"></span> 正在连接 Android Runner…</div>
  <div id="content" style="display:none">
    <div class="banner" id="banner"></div>

    <section>
      <h2>设备 <span class="spacer"></span><span class="pill" id="deviceCount">0</span></h2>
      <div class="cards" id="deviceList"></div>
      <div style="margin-top:8px">
        <h2 style="margin-top:12px">模拟器</h2>
        <div class="chips" id="avdList"></div>
      </div>
    </section>

    <section>
      <h2>应用</h2>
      <div class="kv" id="appKv"></div>
    </section>

    <section>
      <h2>环境</h2>
      <div class="kv" id="envKv"></div>
    </section>

    <section>
      <h2>操作</h2>
      <div class="actions">
        <button class="primary" id="act-run">▶ 运行到设备</button>
        <button id="act-build">⚒ 编译</button>
        <button id="act-install">⤓ 安装 APK</button>
        <button id="act-launch">↗ 启动应用</button>
        <button id="act-stop">■ 停止应用</button>
        <button id="act-restart">⟳ 重启应用</button>
        <button id="act-logcat">≣ 日志</button>
        <button id="act-doctor">✓ 环境自检</button>
        <span class="grow"></span>
        <button class="danger" id="act-uninstall">卸载</button>
        <button class="danger" id="act-cleardata">清数据</button>
      </div>
    </section>

    <section>
      <div class="tabs">
        <button class="tab active" data-tab="output">输出</button>
        <button class="tab" data-tab="logcat">日志</button>
        <span class="spacer" style="flex:1"></span>
        <button class="ghost" id="clearBtn" title="清空">清空</button>
      </div>
      <div class="console-bar">
        <span class="state" id="consoleState">就绪</span>
        <button class="ghost" id="stopJobBtn" style="display:none">停止日志采集</button>
      </div>
      <pre id="console" data-mode="output">这里会显示编译 / 安装 / 启动的实时输出。</pre>
    </section>
  </div>
</main>

<dialog id="confirmDlg">
  <div class="dlg">
    <h3 id="dlgTitle">确认操作</h3>
    <p id="dlgBody"></p>
    <div class="dlg-actions">
      <button id="dlgCancel">取消</button>
      <button class="danger" id="dlgOk">确认</button>
    </div>
  </div>
</dialog>

<script>
'use strict';

/* ============================================================== *
 *  MCP Apps 桥接(与官方插件同一套 ui/initialize + tools/call)     *
 * ============================================================== */

const SURFACE = 'android-runner';
const VERSION = '0.4.0';
const PROTOCOL = '2026-01-26';

const pending = new Map();
let seq = 0;

function rpcSend(message) {
  try { window.parent.postMessage(message, '*'); } catch (e) { /* 宿主未就绪 */ }
}

function rpcRequest(method, params, timeoutMs = 30000) {
  const id = ++seq;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error('请求超时:' + method));
    }, timeoutMs);
    pending.set(id, { resolve, reject, timer });
    rpcSend({ jsonrpc: '2.0', id, method, params });
  });
}

function rpcNotify(method, params) {
  rpcSend({ jsonrpc: '2.0', method, params });
}

window.addEventListener('message', (event) => {
  const msg = event.data;
  if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;
  if (msg.id !== undefined && pending.has(msg.id)) {
    const entry = pending.get(msg.id);
    pending.delete(msg.id);
    clearTimeout(entry.timer);
    if (msg.error) entry.reject(new Error(msg.error.message || '宿主返回错误'));
    else entry.resolve(msg.result);
    return;
  }
  // 宿主通知(主题变化等)—— 样式走 CSS 变量,这里无需处理
});

/** 调用本插件的 MCP 工具(宿主会转发给服务器) */
async function callTool(name, args) {
  const result = await rpcRequest('tools/call', { name, arguments: args || {} }, 60000);
  if (result && result.isError) {
    const text = (result.content || []).map((c) => c.text).filter(Boolean).join('\n');
    throw new Error(text || '工具调用失败');
  }
  if (result && result.structuredContent) return result.structuredContent;
  const text = (result?.content || []).map((c) => c.text).filter(Boolean).join('\n');
  try { return JSON.parse(text); } catch { return { text }; }
}

function reportSize() {
  const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
  const width = Math.ceil(window.innerWidth);
  rpcNotify('ui/notifications/size-changed', { width, height });
}

/* ============================================================== *
 *  状态与渲染                                                      *
 * ============================================================== */

const $ = (id) => document.getElementById(id);
const state = {
  status: null,
  activeJob: null,
  jobTimer: null,
  logcatTimer: null,
  consoleMode: 'output',
  busy: false,
  diag: [],
  notice: null,
  noticeTimer: null
};

function esc(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtSize(bytes) {
  if (!bytes) return '';
  const mb = bytes / 1024 / 1024;
  return (mb >= 1 ? mb.toFixed(1) + ' MB' : Math.round(bytes / 1024) + ' KB');
}

function fmtAgo(ms) {
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 1) return '刚刚构建';
  if (min < 60) return min + ' 分钟前构建';
  const h = Math.round(min / 60);
  if (h < 24) return h + ' 小时前构建';
  return Math.round(h / 24) + ' 天前构建';
}

function shortPath(p) {
  if (!p) return '';
  const parts = p.split('/');
  return parts.length > 2 ? '…/' + parts.slice(-2).join('/') : p;
}

function deviceState(dev) {
  if (dev.state === 'device') return { cls: 'ok', text: '在线' };
  if (dev.state === 'unauthorized') return { cls: 'warn', text: '未授权' };
  if (dev.state === 'offline') return { cls: 'bad', text: '离线' };
  return { cls: '', text: dev.state || '未知' };
}

function currentSerial() {
  const st = state.status;
  if (!st) return null;
  const pref = st.preference;
  if (pref && st.devices.some((d) => d.serial === pref.serial && d.state === 'device')) return pref.serial;
  const ready = st.devices.filter((d) => d.state === 'device');
  return ready.length === 1 ? ready[0].serial : null;
}

function render() {
  const st = state.status;
  if (!st) return;
  $('boot').style.display = 'none';
  $('content').style.display = '';

  const banner = $('banner');
  if (st.projectError) {
    banner.className = 'banner show warn';
    banner.textContent = st.projectError.message;
  } else if (state.notice) {
    banner.className = 'banner show warn';
    banner.textContent = state.notice;
  } else if (st.deviceError) {
    banner.className = 'banner show warn';
    banner.textContent = 'adb 异常:' + st.deviceError;
  } else {
    banner.className = 'banner';
  }

  // 工程
  $('projectLabel').textContent = st.project
    ? st.project.replace(st.workspace + '/', '')
    : '未选择 Gradle 工程';
  $('projectLabel').title = st.project || st.workspace;
  const select = $('projectSelect');
  if ((st.candidates || []).length > 1) {
    select.style.display = '';
    select.innerHTML = st.candidates
      .map((c) => `<option value="${esc(c)}"${c === st.project ? ' selected' : ''}>${esc(c.replace(st.workspace + '/', ''))}</option>`)
      .join('');
  } else {
    select.style.display = 'none';
  }

  // 设备
  const ready = st.devices.filter((d) => d.state === 'device');
  $('deviceCount').textContent = String(ready.length);
  $('deviceCount').className = 'pill ' + (ready.length ? 'ok' : 'warn');
  const active = currentSerial();
  const list = $('deviceList');
  if (!st.devices.length) {
    list.innerHTML = '<div class="empty">没有检测到设备。检查 USB 调试开关,或启动下面的模拟器。</div>';
  } else {
    list.innerHTML = st.devices
      .map((dev) => {
        const stt = deviceState(dev);
        const isCurrent = dev.serial === active;
        const meta = [
          dev.model || dev.serial,
          dev.android ? 'Android ' + dev.android : '',
          dev.isEmulator ? '模拟器' : '真机'
        ].filter(Boolean).join(' · ');
        const useBtn = dev.state === 'device'
          ? `<button data-use="${esc(dev.serial)}"${isCurrent ? ' disabled' : ''}>${isCurrent ? '当前设备' : '设为当前'}</button>`
          : '';
        return `<div class="card${isCurrent ? ' current' : ''}">
          <div class="card-row">
            <span class="card-name">${esc(dev.model || dev.serial)}</span>
            <span class="spacer" style="flex:1"></span>
            <span class="pill ${stt.cls}">${stt.text}</span>
          </div>
          <div class="card-meta">${esc(meta)}</div>
          <div class="card-meta">${esc(dev.serial)}</div>
          <div class="card-actions">${useBtn}</div>
        </div>`;
      })
      .join('');
  }

  // 模拟器
  const avds = st.avds || [];
  $('avdList').innerHTML = avds.length
    ? avds.map((name) => `<span class="chip">${esc(name)}<button data-avd="${esc(name)}">启动</button></span>`).join('')
    : '<div class="empty">没有可用 AVD(可在 Android Studio 里创建)。</div>';

  // 应用
  const app = st.app || {};
  const apk = app.apk;
  $('appKv').innerHTML = [
    kvRow('包名', app.packageName || '未识别', app.packageName ? 'ok' : 'bad'),
    kvRow('模块 / 变体', `${app.module || 'app'} · ${app.variant || 'debug'}`),
    apk
      ? kvRow('APK', `${esc(apk.name)} · ${fmtSize(apk.size)} · ${fmtAgo(apk.modifiedAt)}`)
      : kvRow('APK', '尚未构建', 'bad')
  ].join('');

  // 环境
  const env = st.env || {};
  $('envKv').innerHTML = [
    kvRow('SDK', env.sdk || '未探测到', env.sdk ? 'ok' : 'bad'),
    kvRow('adb', env.adbUsable ? env.adb : (env.adb || '未找到') + '(不可用)', env.adbUsable ? 'ok' : 'bad'),
    kvRow('JDK', env.javaHome ? `${env.javaHome}${env.javaVersion ? ' · ' + env.javaVersion : ''}` : '未探测到', env.javaHome ? 'ok' : 'bad'),
    kvRow('Gradle', `${env.gradleVersion ? 'v' + env.gradleVersion : '未知'} · ${env.task || ''}`)
  ].join('');

  updateButtons();
}

function kvRow(key, value, cls) {
  return `<div class="kv-row"><span class="kv-k">${esc(key)}</span><span class="kv-v ${cls || ''}">${esc(value)}</span></div>`;
}

function updateButtons() {
  const st = state.status;
  const hasProject = !!(st && st.project);
  const hasPkg = !!(st && st.app && st.app.packageName);
  const busy = state.busy || !!state.activeJob;
  const set = (id, enabled) => { $(id).disabled = !enabled || busy; };
  set('act-run', hasProject);
  set('act-build', hasProject);
  set('act-install', hasProject);
  set('act-launch', hasProject && hasPkg);
  set('act-stop', hasProject && hasPkg);
  set('act-restart', hasProject && hasPkg);
  set('act-doctor', hasProject);
  set('act-uninstall', hasProject && hasPkg);
  set('act-cleardata', hasProject && hasPkg);
  $('act-logcat').disabled = !hasProject;
}

/* ============================================================== *
 *  控制台                                                          *
 * ============================================================== */

function consoleWrite(text, { replace = false, mode = 'output' } = {}) {
  const el = $('console');
  if (replace || el.dataset.mode !== mode) {
    el.textContent = '';
    el.dataset.mode = mode;
    state.consoleMode = mode;
  }
  el.textContent += text;
  el.scrollTop = el.scrollHeight;
}

function setConsoleState(text, spinning) {
  $('consoleState').innerHTML = spinning
    ? '<span class="spin"></span> ' + esc(text)
    : esc(text);
}

/** 顶部提示条:用于"已自动卸载重装"这类需要用户知晓的事件。 */
function showNotice(text, ms = 45000) {
  state.notice = text;
  if (state.status) render();
  clearTimeout(state.noticeTimer);
  state.noticeTimer = setTimeout(() => {
    state.notice = null;
    if (state.status) render();
  }, ms);
}

/* ============================================================== *
 *  作业轮询                                                        *
 * ============================================================== */

async function runAction(action, { confirm = false, label } = {}) {
  if (state.activeJob) return;
  const serial = currentSerial();
  stopLogcatPolling(true);
  showTab('output');
  consoleWrite('', { replace: true, mode: 'output' });
  setConsoleState((label || action) + ' 启动中…', true);
  state.busy = true;
  updateButtons();
  try {
    const job = await callTool('panel_action', { action, serial: serial || undefined, confirm });
    state.activeJob = job.jobId;
    setConsoleState(label || action, true);
    $('stopJobBtn').style.display = 'none';
    pollJob(job.jobId, action);
  } catch (error) {
    state.busy = false;
    updateButtons();
    setConsoleState('失败');
    consoleWrite('\n❌ ' + error.message + '\n', { mode: 'output' });
  }
}

function pollJob(jobId, action) {
  clearTimeout(state.jobTimer);
  const tick = async () => {
    try {
      const res = await callTool('panel_job', { id: jobId });
      if (res.output) {
        consoleWrite(res.output, { mode: 'output' });
        if (res.output.includes('自动卸载重装')) {
          showNotice('签名不一致或版本回退,已自动卸载重装 —— 设备上该应用的本地数据已被清空。');
        }
      }
      if (res.running) {
        setConsoleState(`${action} · 已用 ${Math.round(res.elapsedMs / 1000)}s`, true);
        state.jobTimer = setTimeout(tick, 600);
        return;
      }
      state.activeJob = null;
      state.busy = false;
      const ok = res.exitCode === 0;
      setConsoleState(ok ? `${action} 完成 · ${Math.round(res.elapsedMs / 1000)}s` : `${action} 失败 (exit ${res.exitCode})`);
      if (!ok) consoleWrite(`\n❌ 退出码 ${res.exitCode}\n`, { mode: 'output' });
      updateButtons();
      await refreshStatus(true);
    } catch (error) {
      state.activeJob = null;
      state.busy = false;
      updateButtons();
      setConsoleState('轮询失败');
      consoleWrite('\n❌ ' + error.message + '\n', { mode: 'output' });
    }
  };
  tick();
}

/* ============================================================== *
 *  logcat                                                         *
 * ============================================================== */

function stopLogcatPolling(silent) {
  if (state.logcatTimer) {
    clearTimeout(state.logcatTimer);
    state.logcatTimer = null;
  }
  if (!silent) {
    callTool('panel_logcat', { op: 'stop' }).catch(() => {});
    $('stopJobBtn').style.display = 'none';
    setConsoleState('日志已停止');
  }
}

async function startLogcat() {
  showTab('logcat');
  consoleWrite('', { replace: true, mode: 'logcat' });
  setConsoleState('启动 logcat…', true);
  try {
    await callTool('panel_logcat', { op: 'start', serial: currentSerial() || undefined });
  } catch (error) {
    setConsoleState('日志启动失败');
    consoleWrite('❌ ' + error.message + '\n', { mode: 'logcat' });
    return;
  }
  $('stopJobBtn').style.display = '';
  setConsoleState('日志采集中', true);
  const tick = async () => {
    try {
      const res = await callTool('panel_logcat', { op: 'poll' });
      if (res.lines && res.lines.length) {
        consoleWrite(res.lines.join('\n') + '\n', { mode: 'logcat' });
      }
      if (!res.running) {
        setConsoleState('日志流已结束');
        $('stopJobBtn').style.display = 'none';
        return;
      }
    } catch (error) {
      setConsoleState('日志轮询失败');
      return;
    }
    state.logcatTimer = setTimeout(tick, 1200);
  };
  tick();
}

/* ============================================================== *
 *  UI 事件                                                         *
 * ============================================================== */

function showTab(name) {
  document.querySelectorAll('.tab').forEach((tab) => {
    tab.classList.toggle('active', tab.dataset.tab === name);
  });
  const el = $('console');
  el.classList.toggle('logcat', name === 'logcat');
}

function askConfirm(title, body, okLabel) {
  return new Promise((resolve) => {
    const dlg = $('confirmDlg');
    $('dlgTitle').textContent = title;
    $('dlgBody').textContent = body;
    $('dlgOk').textContent = okLabel || '确认';
    const done = (value) => {
      dlg.close();
      $('dlgOk').onclick = null;
      $('dlgCancel').onclick = null;
      resolve(value);
    };
    $('dlgOk').onclick = () => done(true);
    $('dlgCancel').onclick = () => done(false);
    dlg.showModal();
  });
}

const ACTION_LABELS = {
  run: '运行',
  build: '编译',
  install: '安装',
  launch: '启动',
  stop: '停止',
  restart: '重启',
  doctor: '环境自检'
};

function wire() {
  $('act-run').onclick = () => runAction('run', { label: '运行(编译→安装→启动)' });
  $('act-build').onclick = () => runAction('build', { label: '编译' });
  $('act-install').onclick = () => runAction('install', { label: '安装 APK' });
  $('act-launch').onclick = () => runAction('launch', { label: '启动应用' });
  $('act-stop').onclick = () => runAction('stop', { label: '停止应用' });
  $('act-restart').onclick = () => runAction('restart', { label: '重启应用' });
  $('act-doctor').onclick = () => runAction('doctor', { label: '环境自检' });
  $('act-logcat').onclick = () => startLogcat();

  $('act-uninstall').onclick = async () => {
    const pkg = state.status?.app?.packageName;
    const ok = await askConfirm('卸载应用', `确定从设备上卸载 ${pkg || '当前应用'} 吗?设备上的应用数据会一并清除。`, '卸载');
    if (ok) runAction('uninstall', { confirm: true, label: '卸载' });
  };

  $('act-cleardata').onclick = async () => {
    const pkg = state.status?.app?.packageName;
    const ok = await askConfirm('清除应用数据', `确定清除 ${pkg || '当前应用'} 的数据吗?登录态等本地数据会丢失。`, '清数据');
    if (ok) runAction('clear-data', { confirm: true, label: '清除数据' });
  };

  $('refreshBtn').onclick = () => refreshStatus(true);
  $('clearBtn').onclick = () => { $('console').textContent = ''; };
  $('stopJobBtn').onclick = () => stopLogcatPolling(false);

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.onclick = () => {
      showTab(tab.dataset.tab);
      if (tab.dataset.tab === 'logcat' && !state.logcatTimer && !$('console').textContent.trim()) {
        $('console').textContent = '点击「≣ 日志」开始采集当前应用的 logcat。\n';
      }
    };
  });

  // 事件委托:设备 / AVD / 工程
  $('deviceList').addEventListener('click', async (event) => {
    const btn = event.target.closest('button[data-use]');
    if (!btn) return;
    const serial = btn.dataset.use;
    btn.disabled = true;
    try {
      await callTool('panel_use_device', { serial });
      await refreshStatus(true);
    } catch (error) {
      btn.disabled = false;
      alert(error.message);
    }
  });

  $('avdList').addEventListener('click', async (event) => {
    const btn = event.target.closest('button[data-avd]');
    if (!btn) return;
    const name = btn.dataset.avd;
    showTab('output');
    consoleWrite('', { replace: true, mode: 'output' });
    setConsoleState('启动模拟器 ' + name, true);
    btn.disabled = true;
    state.busy = true;
    updateButtons();
    try {
      const job = await callTool('panel_start_avd', { name });
      state.activeJob = job.jobId;
      pollJob(job.jobId, '启动模拟器');
    } catch (error) {
      state.busy = false;
      updateButtons();
      btn.disabled = false;
      setConsoleState('启动失败');
      consoleWrite('❌ ' + error.message + '\n', { mode: 'output' });
    }
  });

  $('projectSelect').onchange = async (event) => {
    const project = event.target.value;
    setConsoleState('切换工程…', true);
    try {
      await callTool('panel_select_project', { project });
      await refreshStatus(true);
    } catch (error) {
      alert(error.message);
    } finally {
      setConsoleState('就绪');
    }
  };

  new ResizeObserver(() => reportSize()).observe(document.documentElement);
}

async function refreshStatus(force) {
  try {
    const status = await callTool('panel_status', force ? { refresh: true } : {});
    state.status = status;
    render();
  } catch (error) {
    $('boot').style.display = 'none';
    $('content').style.display = '';
    const banner = $('banner');
    banner.className = 'banner show';
    banner.textContent = '读取状态失败:' + error.message + (state.diag.length ? ' · ' + state.diag.join(' · ') : '');
  }
}

/** 诊断信息:握手/工具调用失败时显示在横幅里,方便定位是宿主、桥还是脚本的问题。 */
function diag(text) {
  state.diag.push(text);
  if (!state.status) {
    const banner = $('banner');
    banner.className = 'banner show';
    banner.textContent = state.diag.join(' · ');
  }
}

/* ============================================================== *
 *  启动                                                            *
 * ============================================================== */

(async function boot() {
  wire();
  showTab('output');
  if (window.parent === window) {
    diag('未运行在宿主 iframe 中(浏览器直接打开时属正常)');
  }
  try {
    await rpcRequest('ui/initialize', {
      appInfo: { name: SURFACE, version: VERSION },
      appCapabilities: {},
      protocolVersion: PROTOCOL
    }, 5000);
    rpcNotify('ui/notifications/initialized', {});
  } catch (error) {
    diag('ui/initialize 失败:' + error.message);
  }
  reportSize();
  await refreshStatus(false);
  // 每 12 秒刷新一次设备状态(不打断正在运行的作业)
  setInterval(() => {
    if (!state.activeJob && !document.hidden) refreshStatus(true);
  }, 12000);
})();
</script>
