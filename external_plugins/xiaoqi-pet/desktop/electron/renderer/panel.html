<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xiaoqi Tasks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="panel-body">
  <section class="panel" aria-label="Xiaoqi tasks">
    <header class="panel-head">
      <div class="panel-heading">
        <div class="panel-title-line">
          <span class="panel-title" id="app-name">小栖</span>
          <span class="live" id="live"><span class="live-dot"></span><span id="live-label">实时</span></span>
        </div>
        <div class="panel-summary" id="summary"></div>
      </div>
      <div class="panel-actions">
        <button class="icon-button" id="close" type="button" aria-label="Close">×</button>
      </div>
    </header>
    <div class="panel-scroll" id="scroll"></div>
    <footer class="panel-foot" id="foot"></footer>
  </section>
  <script src="common.js"></script>
  <script src="panel.js"></script>
</body>
</html>
