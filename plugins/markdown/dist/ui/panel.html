/**
 * tool tip.
 *
 * @author <a href="http://vanessa.b3log.org">Liyuan Li</a>

@keyframes tooltip-appear {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.vditor-tooltipped {
  position: relative;
  cursor: pointer;
}
.vditor-tooltipped::after {
  position: absolute;
  z-index: 1000000;
  display: none;
  padding: 5px 8px;
  font-size: 11px;
  font-weight: normal;
  -webkit-font-smoothing: subpixel-antialiased;
  color: #fff;
  text-align: center;
  text-decoration: none;
  text-shadow: none;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: break-word;
  white-space: pre;
  pointer-events: none;
  content: attr(aria-label);
  background: #3b3e43;
  border-radius: 3px;
  line-height: 16px;
  opacity: 0;
}
.vditor-tooltipped::before {
  position: absolute;
  z-index: 1000001;
  display: none;
  width: 0;
  height: 0;
  color: #3b3e43;
  pointer-events: none;
  content: "";
  border: 5px solid transparent;
  opacity: 0;
}
.vditor-tooltipped--hover::before,
.vditor-tooltipped--hover::after,
.vditor-tooltipped:hover::before,
.vditor-tooltipped:hover::after,
.vditor-tooltipped:active::before,
.vditor-tooltipped:active::after,
.vditor-tooltipped:focus::before,
.vditor-tooltipped:focus::after {
  display: inline-block;
  text-decoration: none;
  animation-name: tooltip-appear;
  animation-duration: 0.15s;
  animation-fill-mode: forwards;
  animation-timing-function: ease-in;
}
.vditor-tooltipped__s::after,
.vditor-tooltipped__se::after,
.vditor-tooltipped__sw::after {
  top: 100%;
  right: 50%;
  margin-top: 5px;
}
.vditor-tooltipped__s::before,
.vditor-tooltipped__se::before,
.vditor-tooltipped__sw::before {
  top: auto;
  right: 50%;
  bottom: -5px;
  margin-right: -5px;
  border-bottom-color: #3b3e43;
}
.vditor-tooltipped__se::after {
  right: auto;
  left: 50%;
  margin-left: -15px;
}
.vditor-tooltipped__sw::after {
  margin-right: -15px;
}
.vditor-tooltipped__n::after,
.vditor-tooltipped__ne::after,
.vditor-tooltipped__nw::after {
  right: 50%;
  bottom: 100%;
  margin-bottom: 5px;
}
.vditor-tooltipped__n::before,
.vditor-tooltipped__ne::before,
.vditor-tooltipped__nw::before {
  top: -5px;
  right: 50%;
  bottom: auto;
  margin-right: -5px;
  border-top-color: #3b3e43;
}
.vditor-tooltipped__ne::after {
  right: auto;
  left: 50%;
  margin-left: -15px;
}
.vditor-tooltipped__nw::after {
  margin-right: -15px;
}
.vditor-tooltipped__s::after,
.vditor-tooltipped__n::after {
  transform: translateX(50%);
}
.vditor-tooltipped__w::after {
  right: 100%;
  bottom: 50%;
  margin-right: 5px;
  transform: translateY(50%);
}
.vditor-tooltipped__w::before {
  top: 50%;
  bottom: 50%;
  left: -5px;
  margin-top: -5px;
  border-left-color: #3b3e43;
}
.vditor-tooltipped__e::after {
  bottom: 50%;
  left: 100%;
  margin-left: 5px;
  transform: translateY(50%);
}
.vditor-tooltipped__e::before {
  top: 50%;
  right: -5px;
  bottom: 50%;
  margin-top: -5px;
  border-right-color: #3b3e43;
}

/*
 * 风格约定：颜色/字体/圆角/阴影优先消费宿主注入的标准 token
 * （通过 applyTheme 应用到 documentElement），
 * 兜底值仅保证脱离宿主（如浏览器测试）时可读。Vditor 自身的 CSS 变量
 * 在 .vditor 作用域内映射到同一套 token，保证编辑器与 ZCode 视觉一致。
 */
:root {
  color-scheme: light dark;
  --md-bg: var(--color-background-primary, #ffffff);
  --md-bg-soft: var(--color-background-secondary, #f5f5f5);
  --md-bg-hover: var(--color-background-ghost, rgba(0 0 0 / 6%));
  --md-fg: var(--color-text-primary, #404040);
  --md-fg-soft: var(--color-text-secondary, #737373);
  --md-fg-faint: var(--color-text-tertiary, #a3a3a3);
  --md-brand: var(--color-text-info, #2563eb);
  --md-danger: var(--color-text-danger, #dc2626);
  --md-warn: var(--color-text-warning, #ca8a04);
  --md-line: var(--color-border-primary, rgba(10 10 10 / 10%));
  --md-line-strong: var(--color-border-secondary, rgba(10 10 10 / 20%));
  --md-radius: var(--border-radius-md, 6px);
  --md-radius-lg: var(--border-radius-lg, 8px);
  --md-shadow: var(--shadow-lg, 0 10px 15px -3px rgb(0 0 0 / 10%));
  --md-font: var(
    --font-sans,
    ui-sans-serif,
    system-ui,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif
  );
  --md-font-sm: var(--font-text-sm-size, 12px);
  --md-font-md: var(--font-text-md-size, 14px);
}
/* 暗色兜底：宿主 token 缺失（浏览器测试、注入完成前）时保持可读。 */
html[data-theme="dark"] {
  --md-brand: var(--color-text-info, #79c0ff);
  --md-danger: var(--color-text-danger, #ff7b72);
  --md-warn: var(--color-text-warning, #e3b341);
  --md-bg: var(--color-background-primary, #1b1f24);
  --md-bg-soft: var(--color-background-secondary, #23282e);
  --md-bg-hover: var(--color-background-ghost, rgba(255 255 255 / 8%));
  --md-fg: var(--color-text-primary, #e6edf3);
  --md-fg-soft: var(--color-text-secondary, #9aa4b2);
  --md-fg-faint: var(--color-text-tertiary, #6e7781);
  --md-line: var(--color-border-primary, rgba(230 237 243 / 14%));
  --md-line-strong: var(--color-border-secondary, rgba(230 237 243 / 24%));
}
#editor.vditor {
  flex: 1;
  min-width: 0;
  border: 0;
  border-radius: 0;
  --panel-background-color: var(--md-bg);
  --panel-shadow: var(--md-shadow);
  --toolbar-background-color: var(--md-bg-soft);
  --toolbar-icon-color: var(--md-fg-soft);
  --toolbar-icon-hover-color: var(--md-fg);
  --textarea-background-color: var(--md-bg);

  }
  #editor.vditor .vditor-reset {
    padding: 28px 24px 80px !important;
  }
}
@media (max-width: 440px) {
  header {
    gap: 8px;
    padding: 5px 10px;
  }
  header button {
    padding: 4px 7px;
  }
  #editor.vditor .vditor-reset {
    padding: 24px 20px 64px !important;
  }
  footer {
    padding-inline: 10px;
    gap: 6px;
  }
  #word-count {
    display: none;
  }
}
@media (max-height: 360px) {
  .placeholder {
    align-items: flex-start;
    padding: 16px;
  }
  .empty-content h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  .empty-content p {
    margin-bottom: 12px;
  }
}

.outline-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 8px;
  color: var(--md-fg-soft);
  font-size: 12px;
}
#outline-close {
  font-size: 18px;
  padding: 0 8px;
}
#outline-items button {
  display: block;
  width: 100%;
  min-height: 34px;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--md-fg);
  font-size: 13px;
}
#outline-empty {
  padding: 0 12px;
  font-size: 12px;
  color: var(--md-fg-soft);
}

/* Vditor 内容主题可能晚于页面样式加载，表格/引用必须显式继承宿主色。 */
#editor.vditor .vditor-reset table tr {
  background: var(--md-bg);
  color: var(--md-fg);
}
#editor.vditor .vditor-reset table th,
#editor.vditor .vditor-reset table td {
  border-color: var(--md-line-strong);
  color: var(--md-fg);
}
#editor.vditor .vditor-reset table th {
  background: var(--md-bg-soft);
}
#editor.vditor .vditor-reset blockquote {
  color: var(--md-fg-soft);
  border-left-color: var(--md-line-strong);
}
#editor.vditor .vditor-reset blockquote p {
  color: inherit;
}
#editor.vditor .vditor-reset a {
  color: var(--md-brand);
}
.selection-format {
  display: flex;
  align-items: center;
}
.selection-format button {
  display: grid;
  place-items: center;
  width: 32px;
  padding: 6px;
}
.selection-format svg {
  width: 15px;
  height: 15px;
  fill: currentColor;
}
.selection-divider {
  width: 1px;
  height: 18px;
  margin: 0 4px;
  background: var(--md-line-strong);
}

/* 文件菜单 */
.docs {
  position: absolute;
  top: 8px;
  left: 10px;
  z-index: 30;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(420px, calc(100% - 20px));
  max-height: min(560px, calc(100% - 24px));
  overflow: hidden;
  padding: 12px;
  background: var(--md-bg-soft);
  border: 1px solid var(--md-line);
  border-radius: var(--md-radius-lg);
  box-shadow:
    0 3px 10px -4px rgb(0 0 0 / 24%),
    0 12px 24px -12px rgb(0 0 0 / 28%);
}
.docs input:not([type="file"]) {
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--md-line-strong);
  border-radius: var(--md-radius);
  background: var(--md-bg);
  color: var(--md-fg);
  font: inherit;
  font-size: 13px;
}
.docs input:focus {
  border-color: var(--md-brand);
  outline: 0;
  box-shadow: inset 0 0 0 1px var(--md-brand);
}
.docs > :not(.docs-results) {
  flex-shrink: 0;
}
.docs-results {
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
}
html[data-theme="dark"] .docs {
  box-shadow:
    0 3px 10px -4px rgb(0 0 0 / 50%),
    0 12px 24px -12px rgb(0 0 0 / 65%);
}
.docs button {
  min-height: 32px;
}
.file-actions {
  display: flex;
  gap: 4px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--md-line);
}
.file-actions button {
  flex: 1;
  text-align: left;
}
.new-form {
  display: flex;
  gap: 4px;
}
.new-form input {
  flex: 1;
  width: 0;
}
.docs .new-doc {
  color: var(--md-brand);
}
.docs .section .label {
  padding: 8px 8px 4px;
  color: var(--md-fg-soft);
  font-size: 11px;
}
.docs .section button {
  display: block;
  width: 100%;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--md-fg);
}
.docs .section button.current {
  background: var(--md-bg-hover);
  font-weight: 500;
}
.docs .empty-hint {
  padding: 10px 8px;
  color: var(--md-fg-soft);
  font-size: 12px;
}
#docs-feedback:empty {
  display: none;
}

/* Preserve editor measurements while keeping partial initialization out of view. */
body[data-boot] > :not(#boot) {
  visibility: hidden !important;
  opacity: 0;
  pointer-events: none;
}
body[data-boot="connecting"] {
  background: transparent;
}
body[data-boot="connecting"] #boot {
  visibility: hidden;
}
#boot {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px;
  color: var(--md-fg-soft);
  text-align: center;
  font-size: 13px;
  overflow-wrap: anywhere;
}
#boot-retry {
  border: 1px solid var(--md-line-strong);
  color: var(--md-fg);
}
