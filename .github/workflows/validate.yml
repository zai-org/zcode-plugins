name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace and plugin manifests
        run: python scripts/validate.py
      - name: Dry-run distribution build
        run: python scripts/build_dist.py
      - name: Test distribution contract
        run: python -m unittest discover -s tests
